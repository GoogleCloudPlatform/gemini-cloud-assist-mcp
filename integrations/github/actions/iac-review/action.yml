name: 'Cloud Operator IaC Review GitHub Action'
description: 'Invokes the Google Cloud Operator agent via MCP to review IaC & code changes.'
author: 'Google Cloud'

branding:
  icon: 'cloud'
  color: 'blue'

inputs:
  config_path:
    description: 'Path to .github/cloud-operator.yml relative to workspace.'
    required: false
    default: '.github/cloud-operator.yml'
  mcp_url:
    description: 'HTTPS endpoint for Gemini Cloud Assist MCP server.'
    required: false
    default: 'https://geminicloudassist.googleapis.com/mcp'

runs:
  using: 'composite'
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Cloud Operator Action dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$ACTION_PATH/../.."

    - name: Execute Cloud Operator Runner
      shell: bash
      env:
        CLOUD_OPERATOR_MCP_URL: ${{ inputs.mcp_url }}
        CLOUD_OPERATOR_WORKSPACE: ${{ github.workspace }}
        CLOUD_OPERATOR_CONFIG_REL_PATH: ${{ inputs.config_path }}
      run: |
        cloud-operator-github-runner \
          --workspace_dir="$CLOUD_OPERATOR_WORKSPACE" \
          --config_path="$CLOUD_OPERATOR_WORKSPACE/$CLOUD_OPERATOR_CONFIG_REL_PATH"
